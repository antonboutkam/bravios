<!doctype html><html lang="nl"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Bravios · Buizen alle kanten</title>
<style>body{font:16px system-ui;margin:20px;background:#e7efdd;color:#293e4a}button,select{font:inherit;padding:10px;margin:0 6px 10px 0}canvas{display:block;width:min(100%,960px);border-radius:12px}</style>
<h1>Buizen alle kanten</h1><p>Deze proef gebruikt de echte spelmotor en verandert geen opgeslagen levels.</p>
<label>Ingang <select id="from"><option value="32">Boven</option><option value="52">Onder</option><option value="55" selected>Links</option><option value="58">Rechts</option></select></label>
<label>Uitgang <select id="to"><option value="33">Boven</option><option value="53" selected>Onder</option><option value="56">Links</option><option value="59">Rechts</option></select></label>
<button id="enter">Ga de buis in</button><button id="reset">Opnieuw</button><p id="status" role="status">Afbeeldingen laden…</p><canvas width="960" height="512"></canvas>
<script type="module">
import { blankLevel,createGame,stepGame,PIPE_TYPES } from '../engine.mjs?v=21';
import {drawWorld} from '../art.mjs?v=22';import{loadLook}from'../look.mjs?v=8';
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),from=document.querySelector('#from'),to=document.querySelector('#to'),status=document.querySelector('#status');let level,game;
function reset(){level=blankLevel(40);level.tiles[7][8]=Number(from.value);level.tiles[7][21]=Number(to.value);game=createGame(level);const p=game.player;Object.assign(p,{x:8*32+5,y:7*32-p.h,grounded:true});switch(PIPE_TYPES[from.value].opening){case'down':p.y=8*32;p.grounded=false;break;case'left':p.x=8*32-p.w;p.y=7*32+2;break;case'right':p.x=9*32;p.y=7*32+2;break;}paint('Klaar bij de ingang');}
function paint(text){drawWorld(ctx,level,{game,grid:true,viewport:{left:0,right:960,top:0,bottom:512}});status.textContent=`${text} · opening ingang ${from.selectedOptions[0].text} → uitgang ${to.selectedOptions[0].text} · ${game.state}`;}
await loadLook();reset();from.onchange=to.onchange=reset;document.querySelector('#reset').onclick=reset;document.querySelector('#enter').onclick=()=>{stepGame(game,{pipe:true});paint(game.events.includes('pipe')?'Door de buis!':'Geen doorgang');};
</script></html>
