<!doctype html><html lang="nl"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Bravios · Schildpadhelm</title>
<style>body{font:16px system-ui;margin:20px;background:#e4ecd9;color:#283a38}button{font:inherit;padding:10px;margin:0 6px 10px 0}canvas{display:block;max-width:100%;margin:12px 0;border-radius:12px}</style>
<h1>Schildpadhelm</h1><p>Deze controle gebruikt één echte sprong op een schildpad en daarna de helmactie. Je opgeslagen levels blijven bewaard.</p>
<button data-character="boaz">Boaz</button><button data-character="ravi">Ravi</button><button id="cat">Kat</button><button id="dino">Op de dino</button><button id="jump">Spring</button><button id="turn">Draai om</button>
<p id="status" role="status">Afbeeldingen laden…</p><canvas id="world" width="1280" height="768"></canvas><canvas id="detail" width="320" height="320"></canvas>
<script type="module">
import { blankLevel, createGame, stepGame } from '../engine.mjs?v=15';
import { drawWorld } from '../art.mjs?v=16';
import { loadLook } from '../look.mjs?v=8';
const canvas=document.querySelector('#world'),ctx=canvas.getContext('2d'),detail=document.querySelector('#detail'),dc=detail.getContext('2d'),status=document.querySelector('#status');
let game,level,character='boaz';
function make(){
 level=blankLevel(40);level.tiles[13][14]=22;level.tiles[13][16]=16;game=createGame(level);
 for(let i=0;i<24;i++)stepGame(game,{});
 const p=game.player,shell=game.enemies[0];p.character=character;
 Object.assign(p,{x:shell.x+3,y:shell.y-p.h-2,vy:300,grounded:false});
 for(let i=0;i<5;i++)stepGame(game,{});
 Object.assign(p,{x:shell.x-35,y:448-p.h,vy:0,grounded:true});stepGame(game,{mount:true});
 status.textContent=`${character==='boaz'?'Boaz':'Ravi'} · schildpad na één sprong: ${shell.phase} · helm: ${p.shellHelmet?'opgezet':'ontbreekt'}`;
}
for(const button of document.querySelectorAll('[data-character]'))button.onclick=()=>{character=button.dataset.character;make();};
document.querySelector('#cat').onclick=()=>{make();game.player.cat=true;};
document.querySelector('#dino').onclick=()=>{make();const dino=game.dinos[0];dino.x=game.player.x;dino.y=448-dino.h;dino.grounded=true;stepGame(game,{});stepGame(game,{mount:true});};
document.querySelector('#jump').onclick=()=>{stepGame(game,{});stepGame(game,{jump:true});};
document.querySelector('#turn').onclick=()=>{stepGame(game,game.player.facing>0?{left:true}:{right:true});};
await loadLook();make();let last=0,accumulator=0;
function render(time){accumulator+=Math.min(.05,(time-last)/1000||0);last=time;while(accumulator>=1/120){stepGame(game,{});accumulator-=1/120;}
 const left=Math.max(0,game.player.x-240);ctx.setTransform(2,0,0,2,-left*2,-128*2);drawWorld(ctx,level,{game,grid:false,time:game.time,viewport:{left,right:left+640,top:128,bottom:512}});
 dc.setTransform(1,0,0,1,0,0);dc.clearRect(0,0,320,320);const p=game.player;dc.setTransform(4,0,0,4,160-(p.x+p.w/2)*4,160-(p.y+8)*4);drawWorld(dc,level,{game,grid:false,time:game.time,viewport:{left:p.x-40,right:p.x+40,top:p.y-32,bottom:p.y+48}});
 requestAnimationFrame(render);
}requestAnimationFrame(render);
</script></html>
